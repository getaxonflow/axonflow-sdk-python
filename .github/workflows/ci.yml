name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run MyPy
        run: mypy axonflow

      - name: Run falsey-clobber check (no `data.get(...) or X` against pre-existing baseline)
        run: python3 scripts/lint_no_falsey_clobber.py axonflow/ --baseline .lint_baselines/falsey_clobber.json

      # ADR-065: axonflow/authzen_types_gen.py is generated from the vendored
      # copy of the platform's canonical AuthZEN surface artifact. It is
      # committed so a `pip install axonflow` receives working types without
      # running a generator — which is only trustworthy if something proves the
      # committed bytes are the output of the committed input. This is that
      # proof, and it fails on BOTH edits: an artifact bumped without
      # regenerating, and a hand edit of the generated module.
      #
      # tests/test_authzen_generator.py asserts the same property in the test
      # job and asserts that THIS command agrees with it, so the two gates
      # cannot report different answers.
      - name: Check the AuthZEN types are regenerated from the surface artifact
        run: python3 scripts/gen_authzen_types.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      # PR runs only Python 3.11 (current release toolchain). Push to main and
      # workflow_dispatch run the full matrix to catch version-specific drift.
      matrix:
        python-version: ${{ fromJson(github.event_name == 'pull_request' && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      - name: Run tests
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python-sdk
          fail_ci_if_error: false

  # Aggregator that always reports a single check name regardless of the
  # matrix shape (PR-time matrix is `['3.11']`; push/dispatch is full).
  # Branch protection requires `Test Summary`, not the per-version names,
  # so matrix changes don't strand required checks.
  test-summary:
    name: Test Summary
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test matrix result
        run: |
          result="${{ needs.test.result }}"
          echo "test matrix result: $result"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::test matrix did not all pass (result: $result)"
            exit 1
          fi
          echo "Test matrix OK"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
