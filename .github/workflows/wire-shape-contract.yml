name: Wire-Shape Contract

on:
  pull_request:
    branches: [main]
    # The pin guard reads the PR's labels from the event payload. A label
    # attached after the PR opens (`gh pr create --label` adds it in a second
    # call) is not in the `opened` payload, so the guard must re-run when a
    # label is added or removed, or its verdict describes stale labels. It
    # lives in its own workflow so a label change re-runs only this job, not
    # the whole CI.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'axonflow/**'
      - 'pyproject.toml'
      - 'tests/test_wire_shape.py'
      - 'tests/fixtures/wire_shape_baseline.json'
      - 'tests/fixtures/openapi/**'
      - 'scripts/refresh_wire_shape_baseline.py'
      - 'scripts/snapshot_openapi_schemas.py'
      - '.github/workflows/wire-shape-contract.yml'
  push:
    branches: [main]
    paths:
      - 'axonflow/**'
      - 'pyproject.toml'
      - 'tests/test_wire_shape.py'
      - 'tests/fixtures/wire_shape_baseline.json'
      - 'tests/fixtures/openapi/**'
      - 'scripts/refresh_wire_shape_baseline.py'
      - 'scripts/snapshot_openapi_schemas.py'
      - '.github/workflows/wire-shape-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  # QF-15: wire-shape contract CI. Blocks drift between Python SDK pydantic
  # models and the OpenAPI specs that are the authoritative wire contract.
  # Runs on every PR. Drift the baseline does not cover fails the check.
  #
  # The specs are a schema snapshot committed under tests/fixtures/openapi/
  # (see its README), derived from the platform's docs/api at the commit
  # recorded as openapi_specs_sha in tests/fixtures/wire_shape_baseline.json
  # by scripts/snapshot_openapi_schemas.py. The gate is
  # deterministic - a given SDK commit always diffs against the same spec
  # revision. Changing the pin from the same PR that changes SDK models would
  # bypass the gate, so a guard requires a 'spec-pin-bump' label on any PR
  # that moves the SHA OR changes a file under tests/fixtures/openapi/.
  #
  # To pick up new spec changes, replace the snapshot and regenerate the
  # baseline via scripts/refresh_wire_shape_baseline.py, in a dedicated PR.
  wire-shape-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK (full history for SHA-bump guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned OpenAPI specs SHA from baseline
        id: specs_sha
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          path = "tests/fixtures/wire_shape_baseline.json"
          data = json.load(open(path))
          sha = data.get("openapi_specs_sha", "").strip()
          if not sha:
              print(
                  f"::error::{path} is missing openapi_specs_sha. "
                  "Regenerate via scripts/refresh_wire_shape_baseline.py.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"sha={sha}")
          PY

      # Pin-bump guard: the pinned SHA and the spec snapshot are the
      # contract's source of truth. A PR that changes either one together with
      # the SDK models can silently retarget the gate away from the drift it
      # should have caught. Require the explicit 'spec-pin-bump' label to
      # acknowledge the bump. First-time introductions (base branch has no pin
      # yet) bypass the guard.
      - name: Guard against unauthorized OpenAPI specs SHA bump
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          PR_SHA: ${{ steps.specs_sha.outputs.sha }}
        run: |
          set -e
          BASE_SHA=$(
            git show "origin/${BASE_REF}:tests/fixtures/wire_shape_baseline.json" 2>/dev/null \
              | python3 -c "import json, sys; print(json.load(sys.stdin).get('openapi_specs_sha','') or '')" \
              || true
          )
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::Base branch has no openapi_specs_sha yet; treating this PR as the first pin introduction."
            exit 0
          fi
          SNAPSHOT_CHANGED=false
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- tests/fixtures/openapi/; then
            SNAPSHOT_CHANGED=true
          fi
          if [ "$BASE_SHA" = "$PR_SHA" ] && [ "$SNAPSHOT_CHANGED" = false ]; then
            echo "openapi_specs_sha unchanged (${PR_SHA}) and tests/fixtures/openapi/ unchanged."
            exit 0
          fi
          echo "Pin change detected: openapi_specs_sha ${BASE_SHA} -> ${PR_SHA}; snapshot changed: ${SNAPSHOT_CHANGED}"
          HAS_LABEL=$(printf '%s' "$PR_LABELS" | python3 -c "import json, sys; print('spec-pin-bump' in json.load(sys.stdin))")
          if [ "$HAS_LABEL" = "True" ]; then
            echo "::notice::'spec-pin-bump' label present — SHA bump authorized."
            exit 0
          fi
          if [ "$BASE_SHA" != "$PR_SHA" ]; then
            echo "::error::openapi_specs_sha changed from ${BASE_SHA} to ${PR_SHA}."
          fi
          if [ "$SNAPSHOT_CHANGED" = true ]; then
            echo "::error::tests/fixtures/openapi/ changed; the spec snapshot is part of the pin."
          fi
          echo "::error::The wire-shape contract's spec revision is pinned to preserve"
          echo "::error::review integrity: a SHA change in the same PR as SDK changes"
          echo "::error::can silence drift by retargeting the contract to a friendlier"
          echo "::error::revision. Either split this into a dedicated SHA-bump PR, or"
          echo "::error::apply the 'spec-pin-bump' label to this PR to acknowledge that"
          echo "::error::the bump is intentional and has been reviewed independently."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run wire-shape contract tests
        env:
          AXONFLOW_OPENAPI_SPECS_DIR: ${{ github.workspace }}/tests/fixtures/openapi
        run: pytest tests/test_wire_shape.py -m wire_shape -v --no-cov
